ShortDescription: File organizer that plans a tidy folder structure, shows every move before making it, and undoes in one click.
Description: |-
  Onyx reads file names and the folders you already have, then proposes a structure for a messy folder such as Downloads.
  You review the plan as a folder tree and as a list of every move, untick or change moves, and apply.
  One click undoes everything, and undo never overwrites a file that has since appeared at the original spot.
  It works offline with rules; AI planning and tagging are optional, including a local model through Ollama.
  Onyx is also a file explorer with tags, search across all files, previews and a Ctrl+K quick find.
